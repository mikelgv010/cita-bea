<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un plan para Bea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
:root {
  /* Concept: una pregunta por pantalla pensada para el móvil. Foto en arco en la portada, resumen en forma de entrada con foto de la cita elegida, mariposas flotando al fondo y lluvia de corazones al final. */
  --bg: #EFE6DC;
  --bg-2: #E7D9CB;
  --surface: #FBF7F2;
  --ink: #3B1F28;
  --ink-soft: #775C61;
  --accent: #7B2338;
  --on-accent: #FFF6F1;
  --blue: #3E6DB5;
  --pink: #E9AEBB;
  --coral: #E27B64;
  --line: rgba(59, 31, 40, .16);
  --tint: rgba(233, 174, 187, .30);
  --shadow: rgba(59, 31, 40, .20);
  --f-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --f-body: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-script: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1418; --bg-2: #2A1B21; --surface: #33222A; --ink: #F4E9E0; --ink-soft: #BEA7AA;
    --accent: #EDA3B3; --on-accent: #2A1218; --blue: #8FB0E8; --pink: #B96A7E; --coral: #F09A83;
    --line: rgba(244, 233, 224, .18); --tint: rgba(237, 163, 179, .16); --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1418; --bg-2: #2A1B21; --surface: #33222A; --ink: #F4E9E0; --ink-soft: #BEA7AA;
  --accent: #EDA3B3; --on-accent: #2A1218; --blue: #8FB0E8; --pink: #B96A7E; --coral: #F09A83;
  --line: rgba(244, 233, 224, .18); --tint: rgba(237, 163, 179, .16); --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(120% 55% at 50% 0%, var(--tint), transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Mariposas y corazones ---------- */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bf {
  position: absolute; width: var(--s); height: calc(var(--s) * .8); opacity: .6;
  animation: drift var(--dur) ease-in-out infinite alternate;
}
.bf svg { width: 100%; height: 100%; display: block; overflow: visible; }
.bf .wings { fill: var(--c); fill-opacity: .9; transform-box: fill-box; transform-origin: center; animation: flap var(--fl) ease-in-out infinite alternate; }
.bf rect { fill: var(--ink); fill-opacity: .55; }
@keyframes drift {
  0% { transform: translate(0, 0) rotate(-8deg); }
  50% { transform: translate(var(--dx), calc(var(--dy) * -1)) rotate(10deg); }
  100% { transform: translate(calc(var(--dx) * -.6), var(--dy)) rotate(-4deg); }
}
@keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.3); } }

.rain { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
.hrt { position: absolute; top: -40px; left: var(--x); width: var(--w); animation: fall var(--d) ease-in var(--dl) forwards; }
.hrt svg { width: 100%; height: auto; display: block; fill: var(--c); }
@keyframes fall { to { transform: translate(var(--sw), calc(100vh + 90px)) rotate(var(--r)); } }

/* ---------- Estructura ---------- */
.app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 14px; padding: 14px 20px 6px; }
.back {
  flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line);
  background: var(--surface); display: grid; place-items: center; color: var(--ink);
}
.back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.prog { flex: 1; height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--pink), var(--accent)); transition: width .5s cubic-bezier(.3, .8, .3, 1); }
.count { flex: none; min-width: 42px; text-align: right; font-size: 13px; letter-spacing: .06em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.stage { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px 20px 28px; -webkit-overflow-scrolling: touch; }
.scr { display: flex; flex-direction: column; animation: enter .45s cubic-bezier(.3, .8, .3, 1) both; }
@keyframes enter { from { opacity: 0; transform: translateX(var(--fx, 28px)); } to { opacity: 1; transform: none; } }

h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1:focus, h2:focus { outline: none; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.script { font-family: var(--f-script); font-weight: 700; font-style: normal; color: var(--accent); }
.q { font-size: clamp(30px, 8.4vw, 38px); line-height: 1.05; margin-top: 8px; }
.hint { margin: 10px 0 20px; color: var(--ink-soft); font-size: 15.5px; max-width: 34ch; }

/* ---------- Portada ---------- */
.cover { align-items: center; text-align: center; gap: 0; padding-top: 4px; }
.arch-wrap { position: relative; width: min(74vw, 290px); margin-top: 6px; }
.arch-wrap::before {
  content: ""; position: absolute; inset: -9px -9px 0; border: 1.5px solid var(--accent); opacity: .5;
  border-radius: 999px 999px 26px 26px;
}
.arch { position: relative; aspect-ratio: 3 / 3.55; border-radius: 999px 999px 22px 22px; overflow: hidden; box-shadow: 0 18px 34px var(--shadow); background: var(--bg-2); }
.arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; display: block; }
.cover .eyebrow { margin-top: 26px; }
.cover h1 { font-size: clamp(34px, 9.6vw, 44px); line-height: 1.02; margin-top: 10px; }
.cover h1 .script { font-size: 1.28em; line-height: .8; }
.lead { margin: 14px 0 22px; color: var(--ink-soft); font-size: 16px; max-width: 30ch; }
.sign { font-size: 30px; margin: 14px 0 0; transform: rotate(-3deg); }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px;
  padding: 0 24px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent);
  font-weight: 600; font-size: 16px; letter-spacing: .02em; text-decoration: none; text-align: center;
  box-shadow: 0 10px 22px var(--shadow); transition: transform .15s ease;
}
.btn:active { transform: scale(.98); }
.btn svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); box-shadow: none; }
.cover .btn { max-width: 320px; }
.linkbtn { background: none; border: 0; padding: 10px; color: var(--ink-soft); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Plan (pregunta 1) ---------- */
.plans { display: grid; gap: 14px; }
.plan {
  display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: stretch; text-align: left; padding: 0;
  background: var(--surface); border: 2px solid transparent; border-radius: 22px; overflow: hidden;
  box-shadow: 0 8px 20px var(--shadow); transition: transform .2s ease, border-color .2s ease;
}
.plan:active { transform: scale(.985); }
.plan img { width: 100%; height: 100%; min-height: 128px; object-fit: cover; display: block; }
.plan .pt { padding: 16px 16px 16px 18px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
.plan b { font-family: var(--f-display); font-size: 26px; line-height: 1; font-weight: 700; }
.plan i { font-style: normal; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.plan .pt span { font-family: var(--f-script); font-weight: 700; font-size: 22px; color: var(--accent); line-height: 1.1; margin-top: 4px; }
.plan[aria-pressed="true"] { border-color: var(--accent); }

/* ---------- Opciones ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  padding: 16px 14px 16px; min-width: 0; background: var(--surface); border: 2px solid transparent; border-radius: 20px;
  box-shadow: 0 6px 16px var(--shadow); transition: transform .2s ease, border-color .2s ease, background .2s ease;
}
.opt:active { transform: scale(.97); }
.opt .ico { width: 52px; height: 52px; border-radius: 16px; background: var(--tint); display: grid; place-items: center; margin-bottom: 8px; }
.ico svg, .mini svg { width: 36px; height: 36px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico .a, .mini .a { fill: var(--pink); fill-opacity: .6; }
.opt b { font-family: var(--f-display); font-size: 20px; line-height: 1.05; font-weight: 700; }
.opt small { font-size: 13.5px; line-height: 1.3; color: var(--ink-soft); }
.opt.custom { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 14px; cursor: text; }
.opt.custom .ico { margin-bottom: 0; }
.opt.custom b { flex: 1 1 0; min-width: 0; }
.opt.custom input {
  flex: 1 0 100%; width: 100%; margin-top: 10px; padding: 8px 2px; border: 0; border-bottom: 2px solid var(--line);
  background: transparent; color: var(--ink); font-family: var(--f-body); font-size: 16px; border-radius: 0;
}
.opt.custom input::placeholder { color: var(--ink-soft); opacity: .85; }
.opt.custom input:focus { outline: none; border-bottom-color: var(--accent); }
.btn:disabled { opacity: .45; box-shadow: none; cursor: default; }
.cont { margin-top: 18px; }
.opt[aria-pressed="true"], .opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--surface) 82%, var(--pink)); }
.opt[aria-pressed="true"] { transform: scale(1.02); }
.opt[aria-pressed="true"]::after, .opt.on::after {
  content: "♥"; position: absolute; top: 10px; right: 12px; font-size: 18px; color: var(--accent); line-height: 1;
}

/* ---------- Pregunta abierta ---------- */
textarea {
  width: 100%; min-height: 150px; resize: none; padding: 16px 18px; border-radius: 20px; border: 2px solid var(--line);
  background: var(--surface); color: var(--ink); font-family: var(--f-display); font-size: 22px; line-height: 1.3; font-weight: 500;
}
textarea::placeholder { color: var(--ink-soft); opacity: .8; font-style: italic; }
textarea:focus { outline: none; border-color: var(--accent); }
.wishcount { align-self: flex-end; margin: 6px 6px 18px; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* ---------- Resumen ---------- */
.final { gap: 0; }
.final h2 { font-size: clamp(34px, 9.4vw, 42px); line-height: 1.02; margin-top: 8px; }
.final .script.big { font-size: 34px; display: block; margin: 4px 0 6px; }
.polawrap { display: flex; justify-content: center; margin: 18px 0 26px; }
.pola { position: relative; width: min(66%, 250px); padding: 10px 10px 46px; background: var(--surface); border-radius: 6px; box-shadow: 0 16px 30px var(--shadow); transform: rotate(-2.5deg); }
.pola img { width: 100%; aspect-ratio: 3 / 3.6; object-fit: cover; object-position: 50% 30%; display: block; border-radius: 2px; }
.pola .script { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 25px; line-height: 1; }
.ticket { background: var(--surface); border-radius: 22px; overflow: hidden; box-shadow: 0 14px 30px var(--shadow); }
.thead { position: relative; height: 150px; }
.thead img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; display: block; }
.thead::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(30, 12, 18, .78)); }
.thead .tt { position: absolute; z-index: 1; left: 18px; right: 18px; bottom: 14px; color: #FFF6F1; }
.thead .tt b { display: block; font-family: var(--f-display); font-size: 30px; line-height: 1; font-weight: 700; }
.thead .tt span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.rows { margin: 0; padding: 4px 18px 6px; list-style: none; }
.rows li { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.rows li:last-child { border-bottom: 0; }
.mini { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--tint); display: grid; place-items: center; }
.mini svg { width: 30px; height: 30px; }
.rows div { min-width: 0; }
.rows em { display: block; font-style: normal; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.rows strong { display: block; font-family: var(--f-display); font-size: 22px; line-height: 1.1; font-weight: 700; overflow-wrap: anywhere; }
.wish { margin: 0; padding: 16px 20px 20px; border-top: 2px dashed var(--line); }
.wish p { margin: 6px 0 0; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 22px; line-height: 1.25; overflow-wrap: anywhere; white-space: pre-wrap; }
.actions { display: grid; gap: 12px; margin-top: 24px; }
.note { margin: 2px 0 0; text-align: center; font-size: 13.5px; color: var(--ink-soft); }
.again { align-self: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .sky, .rain { display: none; }
}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="app">
  <div class="top" id="top" hidden>
    <button class="back" id="back" type="button" aria-label="Volver a la pregunta anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="prog" id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0" aria-label="Progreso del cuestionario"><i id="bar"></i></div>
    <span class="count" id="count"></span>
  </div>
  <main class="stage" id="stage"></main>
</div>

/* ---------- Pantallas ---------- */
function coverHTML() {
  return `<section class="scr cover">

    <button class="btn" type="button" data-go="1">Empezar</button>
    <p class="script sign">Mikel</p>
  </section>`;
}

function planHTML() {
  const cards = Object.entries(PLANS).map(([k, p]) => `
    <button class="plan" type="button" data-plan="${k}" aria-pressed="${state.plan === k}">
      <img src="${IMG[p.img]}" alt="">
      <span class="pt"><b>${p.name}</b><i>${p.tag}</i></span>
    </button>`).join('');
  return `<section class="scr">
    <p class="eyebrow">Pregunta 1</p>
    <h2 class="q" tabindex="-1">¿Qué plan te apetece más, amor?</h2>
    <p class="hint">Elige uno y yo me encargo del resto.</p>
    <div class="plans">${cards}</div>
  </section>`;
}

function stepHTML(n) {
  const st = PLANS[state.plan].steps[n - 2];
  const sel = state.answers[st.key];
  const txt = state.custom[st.key] || '';
  const hasCustom = st.opts.some(o => o.custom);
  const cards = st.opts.map((o, i) => o.custom ? `
    <label class="opt custom${sel === i ? ' on' : ''}" for="other">
      <span class="ico">${svg(o.i)}</span>
      <b>${o.t}</b>
      <input id="other" type="text" maxlength="60" autocomplete="off" placeholder="Escribe tu opción…" value="${esc(txt)}" data-i="${i}">
    </label>` : `
    <button class="opt" type="button" data-opt="${i}" aria-pressed="${sel === i}">
      <span class="ico">${svg(o.i)}</span>
      <b>${o.t}</b>
      <small>${o.d}</small>
    </button>`).join('');
  const cont = hasCustom ? `<button class="btn cont" type="button" id="cont" ${txt.trim() ? '' : 'disabled'}>Continuar con mi opción</button>` : '';
  return `<section class="scr">
    <p class="eyebrow">Pregunta ${n}</p>
    <h2 class="q" tabindex="-1">${st.q}</h2>
    <p class="hint">${st.sub}</p>
    <div class="grid">${cards}</div>
    ${cont}
  </section>`;
}

function wishHTML() {
  return `<section class="scr">

  </section>`;
}

function chosen() {
  const p = PLANS[state.plan];
  return p.steps.map(st => {
    let o = st.opts[state.answers[st.key]];
    if (o.custom) o = { t: (state.custom[st.key] || '').trim() || o.t, d: '', i: 'star' };
    return { st, o };
  });
}

function shareText() {
  const p = PLANS[state.plan];
  const L = ['¡Hola Mikel! 💌 Ya he elegido nuestro plan:', '', `✨ ${p.name} (${p.tag})`];
  chosen().forEach(({ st, o }) => L.push(`${st.em} ${st.row}: ${o.t}`));
  if (state.wish.trim()) L.push('', `💬 Lo que me haría ilusión: ${state.wish.trim()}`);
  L.push('', 'Bea ❤️');
  return L.join('\n');
}

  const p = PLANS[state.plan];

/* ---------- Navegación ---------- */
function render(dir) {
  const i = state.idx;
  $('top').hidden = i === 0;
  const done = i === SUMMARY ? TOTAL : Math.max(0, i - 1 + 0);
  const pct = i === 0 ? 0 : (i === SUMMARY ? 100 : (i / TOTAL) * 100);
  $('bar').style.width = pct + '%';
  $('prog').setAttribute('aria-valuenow', i === SUMMARY ? TOTAL : i);
  $('count').textContent = i === SUMMARY ? '¡Listo!' : `${i} / ${TOTAL}`;
  stage.style.setProperty('--fx', dir >= 0 ? '28px' : '-28px');
  stage.innerHTML = i === 0 ? coverHTML() : i === 1 ? planHTML() : i === WISH_STEP ? wishHTML() : i === SUMMARY ? summaryHTML() : stepHTML(i);
  stage.scrollTop = 0;
  const h = stage.querySelector('h1, h2');
  if (h) h.focus({ preventScroll: true });
  if (i === SUMMARY) rain();
}

function go(n, dir) {
  state.idx = n;
  busy = false;
  render(dir === undefined ? (n >= 0 ? 1 : -1) : dir);
}

$('back').addEventListener('click', () => { if (state.idx > 0) go(state.idx - 1, -1); });

stage.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-plan],[data-opt],#copy,#cont');
  if (!t || busy) return;
  if (t.dataset.go !== undefined) { go(Number(t.dataset.go), Number(t.dataset.go) < state.idx ? -1 : 1); return; }
  if (t.dataset.plan) {
    if (state.plan !== t.dataset.plan) { state.plan = t.dataset.plan; state.answers = {}; state.custom = {}; }
    mark(t, '.plan');
    return;
  }
  if (t.dataset.opt !== undefined) {
    const st = PLANS[state.plan].steps[state.idx - 2];
    state.answers[st.key] = Number(t.dataset.opt);
    mark(t, '.opt');
    return;
  }
  if (t.id === 'copy') copyText();
  if (t.id === 'cont' && !t.disabled) { busy = true; go(state.idx + 1, 1); }
});

function mark(el, sel) {
  busy = true;
  stage.querySelectorAll('.opt.custom').forEach(c => c.classList.remove('on'));
  stage.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', b === el));
  setTimeout(() => go(state.idx + 1, 1), 420);
}

stage.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'other' && e.target.value.trim()) { e.preventDefault(); busy = true; go(state.idx + 1, 1); }
});

stage.addEventListener('input', e => {
  if (e.target.id === 'other') {
    const st = PLANS[state.plan].steps[state.idx - 2];
    const i = Number(e.target.dataset.i);
    const v = e.target.value;
    state.custom[st.key] = v;
    const ok = v.trim().length > 0;
    if (ok) state.answers[st.key] = i; else if (state.answers[st.key] === i) delete state.answers[st.key];
    stage.querySelectorAll('.opt[data-opt]').forEach(b => b.setAttribute('aria-pressed', ok ? 'false' : b.getAttribute('aria-pressed')));
    e.target.closest('.opt').classList.toggle('on', ok);
    $('cont').disabled = !ok;
    return;
  }
  if (e.target.id === 'wish') {
    state.wish = e.target.value;
    $('wishcount').textContent = `${state.wish.length} / 400`;
  }
});

function copyText() {
  const txt = shareText();
  const ok = () => { $('note').textContent = 'Resumen copiado. Ya puedes pegarlo en un mensaje.'; };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? ok() : $('note').textContent = 'No se pudo copiar. Usa el botón de WhatsApp.'; }
    catch (_) { $('note').textContent = 'No se pudo copiar. Usa el botón de WhatsApp.'; }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback);
  else fallback();
}

/* ---------- Mariposas ---------- */
const BF = '<svg viewBox="0 0 40 32" aria-hidden="true"><g class="wings"><path d="M20 16C16 3 3 1 3 11c0 6 8 9 17 5z"/><path d="M20 16C11 19 6 29 12 30c5 1 8-6 8-14z"/><path d="M20 16C24 3 37 1 37 11c0 6-8 9-17 5z"/><path d="M20 16C29 19 34 29 28 30c-5 1-8-6-8-14z"/></g><rect x="19" y="9" width="2" height="15" rx="1"/></svg>';
(function butterflies() {
  const sky = $('sky');
  const cols = ['var(--pink)', 'var(--blue)', 'var(--coral)', 'var(--accent)'];
  for (let i = 0; i < 7; i++) {
    const b = document.createElement('div');
    b.className = 'bf';
    const s = 24 + Math.random() * 22;
    b.style.cssText = `--s:${s}px;--c:${cols[i % 4]};left:${Math.random() * 90}%;top:${Math.random() * 86}%;` +
      `--dx:${Math.random() * 140 - 70}px;--dy:${Math.random() * 140 - 70}px;--dur:${14 + Math.random() * 10}s;` +
      `--fl:${0.45 + Math.random() * 0.3}s;animation-delay:-${(Math.random() * 14).toFixed(1)}s`;
    b.innerHTML = BF;
    sky.appendChild(b);
  }
})();

/* ---------- Corazones ---------- */
const HEART = '<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C2 14 .5 8 4.5 4.5 7.8 1.7 11 3.5 12 6c1-2.5 4.2-4.300 7.500-1.500C23.500 8 22 14 12 21z"/></svg>';
function rain() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const old = document.querySelector('.rain'); if (old) old.remove();
  const box = document.createElement('div');
  box.className = 'rain'; box.setAttribute('aria-hidden', 'true');
  const cols = ['var(--pink)', 'var(--accent)', 'var(--coral)', 'var(--blue)'];
  for (let i = 0; i < 42; i++) {
    const h = document.createElement('span');
    h.className = 'hrt';
    h.style.cssText = `--x:${Math.random() * 96}%;--w:${14 + Math.random() * 20}px;--c:${cols[i % 4]};` +
      `--d:${3.600 + Math.random() * 3.400}s;--dl:${(Math.random() * 2.600).toFixed(2)}s;` +
      `--sw:${Math.random() * 90 - 45}px;--r:${Math.random() * 360 - 180}deg`;
    h.innerHTML = HEART;
    box.appendChild(h);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 9500);
}

render(1);
</script>
